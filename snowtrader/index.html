<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d1a">
<link rel="icon" href="data:,">
<title>Rush · בחרו עולם</title>
<meta name="description" content="שני עולמות תלת־ממדיים: כפר סקי עם סנובורד, ועיירת חוף עם גלישת גלים וקייטסרף.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="prefetch" href="lib/three.min.js">
<style>
  /* the opening menu: two worlds side by side (stacked on an upright phone), each a card drawn in CSS */
  :root{--g:#16e08a;--gold:#ffc83a;--font:'Rubik',system-ui,sans-serif;--display:'Anton','Rubik',Impact,sans-serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0d1a;color:#fff;font-family:var(--font);overscroll-behavior:none}
  main{position:fixed;inset:0;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));gap:12px}
  header{display:flex;align-items:baseline;justify-content:center;gap:6px 14px;flex:0 0 auto;flex-wrap:wrap}
  header h1{margin:0;font:400 clamp(30px,5.4vw,52px)/1 var(--display);letter-spacing:.08em;direction:ltr;text-shadow:0 3px 0 #000}
  header h1 b{font-weight:400;color:var(--gold)}
  header p{margin:0;font-weight:700;font-size:clamp(13px,1.8vw,17px);opacity:.75}
  .worlds{flex:1 1 auto;display:flex;gap:14px;min-height:0}
  .world{display:block;text-decoration:none;position:relative;flex:1 1 0;border:0;border-radius:24px;overflow:hidden;cursor:pointer;color:#fff;text-align:right;padding:0;font:inherit;isolation:isolate;
    box-shadow:0 14px 40px rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,255,255,.18);transition:transform .18s ease,box-shadow .18s ease}
  .world:hover,.world:focus-visible{transform:translateY(-3px) scale(1.01);box-shadow:0 20px 50px rgba(0,0,0,.55),inset 0 0 0 3px rgba(255,255,255,.55);outline:none}
  .world:active{transform:scale(.985)}
  .art{position:absolute;inset:0;z-index:-1}
  /* snow: a cold sky, two ranges of peaks with snow caps, pines, falling snow */
  .snow .art{background:linear-gradient(180deg,#3b6fb6 0%,#8fb8e6 52%,#e8f2ff 100%)}
  .snow .art::before{content:'';position:absolute;left:-10%;right:-10%;bottom:30%;height:58%;background:#c6d8ef;
    clip-path:polygon(0 100%,8% 58%,17% 74%,29% 22%,38% 50%,47% 34%,58% 70%,68% 18%,79% 56%,88% 40%,100% 72%,100% 100%)}
  .snow .art::after{content:'';position:absolute;left:-6%;right:-6%;bottom:0;height:62%;background:linear-gradient(180deg,#ffffff 0%,#eaf3ff 55%,#d6e6fa 100%);
    clip-path:polygon(0 30%,12% 8%,22% 34%,34% 0,47% 30%,57% 14%,69% 38%,80% 6%,91% 28%,100% 18%,100% 100%,0 100%)}
  .pines{position:absolute;z-index:1;bottom:14%;left:0;right:0;height:22%;display:flex;justify-content:space-around;align-items:flex-end;opacity:.9}
  .pines i{display:block;width:5%;height:100%;background:#1f4a3a;clip-path:polygon(50% 0,100% 100%,0 100%)}
  .pines i:nth-child(2n){height:72%} .pines i:nth-child(3n){height:86%}
  .flakes{position:absolute;z-index:2;inset:0;background-image:radial-gradient(#fff 1.3px,transparent 1.6px),radial-gradient(#fff 1px,transparent 1.3px);background-size:46px 46px,29px 29px;background-position:0 0,13px 19px;opacity:.75;animation:fall 7s linear infinite}
  @keyframes fall{to{background-position:0 46px,13px 77px}}
  /* the beach: a warm sky and sun, the sea with its swell, the sand, a kite */
  .beach .art{background:linear-gradient(180deg,#2b8fd6 0%,#7cc6ee 46%,#bfe7f5 62%,#1e8fb0 62.2%,#0e6f97 74%,#1aa5b8 82%,#f2d9a2 82.2%,#e9c98a 100%)}
  .sun{position:absolute;top:12%;left:14%;width:16%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fffbe0 0 46%,#ffe27a 60%,rgba(255,226,122,0) 72%)}
  .swell{position:absolute;left:0;right:0;height:3px;background:rgba(255,255,255,.55);border-radius:3px;animation:swell 5s ease-in-out infinite}
  .swell.a{top:66%;transform:scaleX(.7)} .swell.b{top:72%;animation-delay:-1.6s} .swell.c{top:78.5%;animation-delay:-3.2s;opacity:.85}
  @keyframes swell{0%,100%{transform:translateX(-6%) scaleX(.85)}50%{transform:translateX(6%) scaleX(1)}}
  .kite{position:absolute;top:18%;right:22%;width:24%;aspect-ratio:2.4;animation:fly 4s ease-in-out infinite}
  .kite::before{content:'';position:absolute;inset:0;border-radius:100% 100% 18% 18%/140% 140% 30% 30%;background:linear-gradient(90deg,#111 0 10%,#ff3b30 10% 42%,#fff 42% 58%,#ff3b30 58% 90%,#111 90%);border-top:5px solid #111}
  .kite::after{content:'';position:absolute;left:50%;top:60%;width:1.5px;height:190%;background:rgba(20,20,20,.55);transform-origin:top;transform:rotate(28deg)}
  @keyframes fly{0%,100%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(-8%,6%) rotate(5deg)}}
  .palm{position:absolute;bottom:9%;left:7%;width:3.4%;height:30%;background:#7a5634;border-radius:40% 40% 0 0;transform:rotate(-6deg);transform-origin:bottom}
  .palm::before{content:'';position:absolute;top:-22%;left:-260%;width:620%;height:36%;background:#2f8a43;clip-path:polygon(50% 60%,0 20%,22% 52%,6% 82%,40% 66%,50% 100%,60% 66%,94% 82%,78% 52%,100% 20%)}
  /* the words on a card */
  .txt{position:absolute;inset:auto 0 0 0;padding:clamp(14px,2.6vw,26px);background:linear-gradient(0deg,rgba(6,10,24,.82) 0%,rgba(6,10,24,.55) 62%,rgba(6,10,24,0) 100%)}
  .txt h2{margin:0 0 4px;font:400 clamp(30px,5vw,58px)/1 var(--display);letter-spacing:.06em;direction:ltr;text-align:right;text-shadow:0 3px 0 #000}
  .txt h2 b{font-weight:400;color:var(--gold)} .beach .txt h2 b{color:#39e1ff}
  .txt .sub{font-weight:900;font-size:clamp(15px,2.1vw,21px)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 12px}
  .chips span{font-size:12px;font-weight:700;padding:4px 10px;border-radius:30px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25)}
  .chips span.soon{opacity:.6;border-style:dashed}
  .go{display:inline-flex;align-items:center;gap:10px;padding:10px 22px;border-radius:16px;font:900 clamp(16px,2vw,20px) var(--font);color:#05140c;background:linear-gradient(180deg,#3df2a6,#12c47a);box-shadow:0 6px 0 #0a7d4c}
  .beach .go{background:linear-gradient(180deg,#5ee7ff,#13b6e0);box-shadow:0 6px 0 #0a6f8a;color:#03222c}
  .beach .go.surfnow{margin-inline-start:10px;background:linear-gradient(180deg,#ffffff,#d6f6ff);box-shadow:0 6px 0 #6fb7c9;color:#03222c}   /* straight into a surf session */
  .best{position:absolute;top:14px;right:14px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:12px;background:rgba(6,10,24,.55);backdrop-filter:blur(6px)}
  .best:empty{display:none}
  .purse{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:30px;background:rgba(255,200,58,.14);border:1px solid rgba(255,200,58,.45);font-weight:900;font-size:clamp(13px,1.8vw,16px)}
  .purse b{font-family:var(--display);font-weight:400;letter-spacing:.05em;color:var(--gold);direction:ltr}.purse i{font-style:normal;opacity:.8;font-weight:700;font-size:.85em}
  .purse[hidden]{display:none}
  @media (orientation:portrait){ .worlds{flex-direction:column} .txt h2{font-size:clamp(30px,9vw,46px)} .chips{margin:7px 0 10px} }
  @media (max-height:430px){ header p{display:none} .chips{display:none} .txt h2{font-size:34px} }
  @media (prefers-reduced-motion:reduce){ .flakes,.swell,.kite{animation:none} }
</style>
</head>
<body>
<main>
  <header><h1>SNOW<b>·</b>SURF <b>RUSH</b></h1><p>בחרו לאן יוצאים היום</p><span class="purse" id="purse" hidden title="ארנק אחד לשני העולמות">🪙 <b id="purseN">0</b><i id="purseF"></i></span></header>
  <div class="worlds">
    <a class="world snow" href="snow.html" id="goSnow">
      <div class="art"><div class="pines"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="flakes"></div></div>
      <div class="best" id="bestSnow"></div>
      <div class="txt"><h2>SNOW <b>RUSH</b></h2><div class="sub">כפר סקי · סנובורד</div>
        <div class="chips"><span>🏂 מסלולים ופארק</span><span>🚡 רכבל</span><span>🏘️ כפר לטייל בו</span></div>
        <span class="go">🏔️ לכפר הסקי</span></div>
    </a>
    <a class="world beach" href="beach.html" id="goBeach">
      <div class="art"><div class="sun"></div><div class="swell a"></div><div class="swell b"></div><div class="swell c"></div><div class="kite"></div><div class="palm"></div></div>
      <div class="best" id="bestBeach"></div>
      <div class="txt"><h2>SURF <b>RUSH</b></h2><div class="sub">עיירת חוף · גלים וקייטסרף</div>
        <div class="chips"><span>🌊 גלישת גלים</span><span>🪁 קייטסרף</span><span>🌴 טיילת לטייל בה</span><span class="soon">⛵ רוח — בקרוב</span></div>
        <span class="go">🏖️ לעיירת החוף</span><span class="go surfnow" role="link" tabindex="0" id="surfNow">🌊 ישר לגלים</span></div>
    </a>
  </div>
</main>
<script src="js/wallet.js"></script>
<script>
  // what each world remembers: its best score, shown on its card
  (function(){ const fmt=n=>Math.round(n).toLocaleString('en-US'), read=k=>{ try{ return JSON.parse(localStorage.getItem(k)||'{}'); }catch(e){ return {}; } };
    const s=read('snowtrader.v1'), b=read('surfrush.v1');
    const sBest=s.best?Math.max(0,...Object.values(s.best).map(v=>v&&v.profit||0)):0; if(sBest>0) document.getElementById('bestSnow').textContent='שיא: '+fmt(sBest);
    const bb=Math.max(b.best||0,b.sbest||0); if(bb>0) document.getElementById('bestBeach').textContent='שיא סשן: '+fmt(bb);
    // the purse both worlds share (js/wallet.js): coins earned in either, spent on boards and plane tickets
    // "straight to the waves": into a surf session at the surf school (the card itself goes to the town)
    const sn=document.getElementById('surfNow'), goSurf=e=>{ e.preventDefault(); e.stopPropagation(); location.href='beach.html?go=surf'; };
    sn.addEventListener('click',goSurf); sn.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' ') goSurf(e); });
    const W=window.RushWallet; if(W&&(W.coins>0||W.earned>0)){ document.getElementById('purseN').textContent=W.fmt(W.coins); if(W.flights) document.getElementById('purseF').textContent=' · ✈️ '+W.flights; document.getElementById('purse').hidden=false; } })();
</script>
</body>
</html>
