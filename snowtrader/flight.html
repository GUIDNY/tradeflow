<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b2545">
<link rel="icon" href="data:,">
<title>Rush Air · טיסה</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* the flight between the worlds: a boarding pass, then the plane (js/flight.js) */
  :root{--font:'Rubik',system-ui,sans-serif;--display:'Anton','Rubik',Impact,sans-serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b2545;color:#fff;font-family:var(--font);overscroll-behavior:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #pass{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(ellipse at 50% 30%,#1d4e89 0%,#0b2545 70%);z-index:5;transition:opacity .6s}
  #pass.go{opacity:0;pointer-events:none}
  .card{width:min(440px,100%);border-radius:20px;overflow:hidden;background:#fff;color:#0b2545;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .card .hd{background:linear-gradient(135deg,#0b2545,#134074);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;direction:ltr}
  .card .hd b{font:400 24px/1 var(--display);letter-spacing:.12em}.card .hd b i{font-style:normal;color:#5ee7ff}
  .card .hd span{font:400 15px/1 var(--display);letter-spacing:.1em;opacity:.85}
  .route{display:flex;justify-content:space-between;align-items:center;direction:ltr;padding:18px 20px 6px}
  .route div{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:110px}
  .route b{font:400 52px/1 var(--display);letter-spacing:.05em}
  .route span{font-size:13px;font-weight:700;color:#4a5a78;direction:rtl}
  .route i{font-style:normal;font-size:28px;color:#e76f51}
  .meta{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:12px 18px 16px;border-bottom:2px dashed #cdd6e6;text-align:center;font-size:11px;color:#6b7a96}
  .meta b{display:block;font-size:17px;color:#0b2545;margin-top:2px}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px}
  .bars{flex:1;height:38px;background:repeating-linear-gradient(90deg,#0b2545 0 2px,transparent 2px 4px,#0b2545 4px 7px,transparent 7px 9px,#0b2545 9px 10px,transparent 10px 13px);opacity:.85}
  #board{font:900 18px var(--font);border:0;border-radius:14px;padding:12px 20px;color:#03222c;background:linear-gradient(180deg,#5ee7ff,#13b6e0);box-shadow:0 5px 0 #0a6f8a;cursor:pointer}
  #board:active{transform:translateY(3px);box-shadow:0 2px 0 #0a6f8a}
  #hud{position:fixed;left:0;right:0;top:0;padding:max(12px,env(safe-area-inset-top)) 16px 0;display:flex;align-items:center;gap:12px;z-index:3;pointer-events:none;opacity:0;transition:opacity .6s}
  #hud.on{opacity:1}
  #hud .fl{font:400 15px/1 var(--display);letter-spacing:.1em;direction:ltr;text-shadow:0 2px 6px rgba(0,0,0,.4)}
  #prog{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.3);position:relative;direction:ltr}
  #prog i{position:absolute;left:0;top:-9px;font-style:normal;font-size:18px;transform:translateX(-50%);filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
  #skip{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));z-index:4;font:700 15px var(--font);color:#fff;background:rgba(10,14,30,.45);border:1px solid rgba(255,255,255,.35);border-radius:12px;padding:9px 14px;backdrop-filter:blur(6px);cursor:pointer}
  #say{position:fixed;left:50%;top:calc(max(12px,env(safe-area-inset-top)) + 44px);transform:translateX(-50%);z-index:3;font:900 clamp(18px,4.2vw,30px) var(--font);text-shadow:0 3px 10px rgba(0,0,0,.45);text-align:center;opacity:0;transition:opacity .8s;pointer-events:none;width:90%}
  #say.on{opacity:1}
  #mist{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 45%,#fbfdff 0%,#eef3f9 60%,#dfe7f1 100%)}
  #white{position:fixed;inset:0;background:#f4f8ff;z-index:6;opacity:0;pointer-events:none;transition:opacity .5s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="pass"><div class="card">
  <div class="hd"><b>RUSH <i>AIR</i></b><span id="pNo">RX 204</span></div>
  <div class="route"><div><b id="pFrom">TLV</b><span id="pFromN"></span></div><i>✈</i><div><b id="pTo">ALP</b><span id="pToN"></span></div></div>
  <div class="meta"><div>שער<b>3</b></div><div>מושב<b>14A</b></div><div>עלייה<b id="pTime">--:--</b></div><div>משך<b>2:40</b></div></div>
  <div class="foot"><div class="bars"></div><button id="board">עולים למטוס ✈️</button></div>
</div></div>
<div id="hud"><span class="fl" id="hFl">RX 204 · TLV ✈ ALP</span><div id="prog"><i>✈️</i></div></div>
<div id="say"></div>
<button id="skip">דילוג ⏭</button>
<div id="mist"></div>
<div id="white"></div>
<script src="lib/three.min.js"></script>
<script src="js/wallet.js"></script>
<script src="js/flight.js"></script>
</body>
</html>
